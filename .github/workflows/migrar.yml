name: migrar
on:
  push:
    branches: [main]
    paths: ['migrations/**']
jobs:
  aplicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npx --yes wrangler d1 migrations apply desenho-assinado-db --remote
      - name: Confere a tabela notas
        run: npx --yes wrangler d1 execute desenho-assinado-db --remote --command "PRAGMA table_info(notas)"
      # Bônus: resumo das migrações por IA no resumo da execução
      - run: npm install -g @github/copilot
      - name: Monta o prompt do resumo
        run: |
          {
            echo "Resuma em português, em até 5 itens, o que estas migrações SQL do D1 fazem:"
            for f in migrations/*.sql; do echo "--- $f"; cat "$f"; done
          } > resumo.txt
      - id: resumo
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: resumo.txt
          system-prompt: Você resume migrações de banco de dados de forma objetiva.
      - name: Escreve o resumo
        run: |
          echo "## Resumo das migrações (IA)" >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.resumo.outputs.response-file }}" >> "$GITHUB_STEP_SUMMARY"
